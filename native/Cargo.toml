[package]
name = "petrea-binding"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Native Rust implementation of petrea"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.14.2", default-features = false, features = ["napi8"] }
napi-derive = "3.6.12"
oxc_allocator = { version = "0.153.0", features = ["pool"] }
oxc_parser = "0.153.0"
oxc_ast = "0.153.0"
oxc_ast_visit = "0.153.0"
oxc_span = "0.153.0"
oxc_syntax = "0.153.0"
dtoa = "1.0.11"
oxc_diagnostics = "0.153.0"

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = "thin"
# drop the symbol table + debug info; the dynamic exports napi loads through
# stay. distribution size matters: every shipped target is ~1.5 MB otherwise
strip = "symbols"
