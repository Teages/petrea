name: release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  # merged release PRs, publish reruns, and prereleases all arrive here
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Cut a prerelease instead of a normal release, e.g. `beta`, `rc`, or `0`'
        required: false
        default: ''
      npm-tag:
        description: npm dist-tag to publish to. Set by uppt/release for maintenance lines; leave blank otherwise
        required: false
        default: ''

permissions: {}

env:
  NPM_TAG: ${{ inputs.npm-tag || 'latest' }}

jobs:
  # open or update a draft release PR from conventional commits
  pr:
    if: |
      !github.event.repository.fork
      && (
        (
          github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        ) || (
          github.event_name == 'workflow_dispatch'
          && !startsWith(github.ref, 'refs/tags/')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: danielroe/uppt/pr@65a86313a63b10a6793de6c4ff8614b18e127a71 # v0.6.10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ inputs.prerelease }}

  # release PR merged: tag it, cut a GitHub release, dispatch the publish run
  release:
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.repository.fork
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: danielroe/uppt/release@65a86313a63b10a6793de6c4ff8614b18e127a71 # v0.6.10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # the chained dispatch lands here on the vX.Y.Z tag: build every platform
  # binary + the wasm module first
  native:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/native-build.yml
    permissions:
      contents: read

  # assemble the binding packages from the prebuilt binaries, then STAGE the
  # whole batch: every @petrea/binding-* package first, then the main `petrea`
  # package whose optionalDependencies pin their exact versions. Nothing goes
  # live from CI — `pnpm stage publish` only queues the versions; a maintainer
  # approves each one interactively (`npm stage approve <stage-id>`, 2FA).
  # Approval order matters: approve the bindings before petrea, so the main
  # package never becomes installable while its optionalDependencies are
  # still staged.
  publish:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    # the npm environment is part of the trusted publisher identity: each
    # package's publisher on npmjs.com names this repository, this workflow
    # file, and this environment
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm and the Node runtime (both from devEngines) in one step;
      # replaces corepack, which Node 26 removes
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false
      # staged publishing needs 11.15 at minimum; the runner's bundled npm
      # trails that. No auth token is configured: npm exchanges the Actions
      # OIDC token for a stage credential itself — the trusted publishers on
      # npmjs.com must allow stage-publishing for every package
      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.19.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binding-*
          path: ${{ runner.temp }}/native-bindings
          merge-multiple: true
      - run: pnpm install
      - name: Assemble binding packages from prebuilt binaries
        run: pnpm prepare-packages
        env:
          NAPI_PREBUILT_DIR: ${{ runner.temp }}/native-bindings
      # prepare-packages mutates the root and wasm manifests; resync
      # (non-frozen) or the deps-status check inside `pnpm build:js` — run by
      # the root package's prepack — hits the CI default frozen install.
      # Unpublished optional deps are skipped with a warning, not an error
      - name: Resync lockfile with the assembled manifests
        run: pnpm install --no-frozen-lockfile
      # a rerun after a partial failure must not collide with the versions
      # that already made it out. `pnpm view` only sees approved versions: a
      # version that is still staged makes staging conflict — reject or
      # approve it first, then rerun
      - name: Stage @petrea/binding-* packages
        run: |
          stage_if_needed() {
            local pkg_name pkg_version
            pkg_name=$(node -p "require('./package.json').name")
            pkg_version=$(node -p "require('./package.json').version")
            if pnpm view "${pkg_name}@${pkg_version}" version >/dev/null 2>&1; then
              echo "Skipping ${pkg_name}@${pkg_version} (already published)"
              return 0
            fi
            # the tree is intentionally dirty here: prepare-packages assembles
            # the manifests and the lockfile resync rewrites pnpm-lock.yaml,
            # so pnpm's publish git checks must stay off
            pnpm stage publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
          }
          for pkg in npm/*/; do
            if [ -f "$pkg/package.json" ]; then
              echo "Staging $(basename "$pkg")..."
              (cd "$pkg" && stage_if_needed)
            fi
          done
      - name: Stage petrea
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if pnpm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "Skipping ${PKG_NAME}@${PKG_VERSION} (already published)"
            exit 0
          fi
          # packing runs prepack, which builds dist/ from src/; the binding
          # packages ride along through optionalDependencies. Same dirty-tree
          # rationale as the bindings step: --no-git-checks or bust
          pnpm stage publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
