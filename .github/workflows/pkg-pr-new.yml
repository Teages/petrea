name: pkg.pr.new preview

# Continuous previews: every PR and every push to main publishes the main
# package plus all @petrea/binding-* packages to https://pkg.pr.new in a
# single publish call, so pkg.pr.new rewrites the main package's
# optionalDependencies entries pointing at the batch into preview URLs.
# Requires the pkg-pr-new GitHub App (https://github.com/apps/pkg-pr-new)
# to be installed on this repository.
on:
  pull_request:
  push:
    branches: [main]
    tags: ['!**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: pkg-pr-new-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    uses: ./.github/workflows/native-build.yml
    permissions:
      contents: read

  publish:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm i -g corepack@latest && corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binding-*
          path: ${{ runner.temp }}/native-bindings
          merge-multiple: true
      - run: pnpm install
      - name: Assemble binding packages from prebuilt binaries
        run: pnpm prepare-packages
        env:
          NAPI_PREBUILT_DIR: ${{ runner.temp }}/native-bindings
      # prepare-packages intentionally mutates the root and wasm manifests;
      # resync (non-frozen) so the deps-status check inside every later
      # `pnpm` invocation doesn't hit the CI default frozen-lockfile install.
      # Unpublished optional deps are skipped with a warning, not an error
      - name: Resync lockfile with the assembled manifests
        run: pnpm install --no-frozen-lockfile
      - name: Publish preview to pkg.pr.new
        # one call for the whole batch: the root package plus every binding
        # package dir, so cross-references become pkg.pr.new URLs. The default
        # comment is suppressed (it would list all ten packages) — a curated
        # main-package-only comment is posted below
        run: pnpm exec pkg-pr-new publish --comment=off --packageManager=pnpm . ./npm/*
      - name: Post preview comment
        if: github.event.pull_request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // only the main package, mirroring the single-package comment
            // format used before the split; the marker keeps it a single
            // self-updating comment across commits
            const prNumber = context.payload.pull_request.number
            const sha = context.sha
            const marker = '<!-- petrea preview comment -->'
            const body = [
              marker,
              '  ```',
              `  pnpm add https://pkg.pr.new/petrea@${prNumber}`,
              '  ```',
              '',
              `_commit: <a href="https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}"><code>${sha.slice(0, 7)}</code></a>_`,
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            })
            const existing = comments.find(comment => comment.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            }
            else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              })
            }
