name: native build

# Builds the napi binding for every platform the loader in src/index.ts
# can pick up (see platformPackage), cross-compiling wherever possible, and
# smoke-loads each binary on matching hardware. Artifacts are named
# `binding-<triple>` so a release pipeline can download the full matrix.
# Runs only as a reusable workflow: pkg-pr-new.yml calls it on PRs and
# main pushes, release.yml on tags. No push/pull_request triggers of its
# own — a direct run shares the concurrency group below with those calls
# and one of the two gets cancelled on every push.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: Apple's toolchain cross-links both slices on the arm64 runner
          - target: aarch64-apple-darwin
            os: macos-15
            artifact: binding.darwin-arm64.node
            smoke: native
          - target: x86_64-apple-darwin
            os: macos-15
            artifact: binding.darwin-x64.node
            smoke: rosetta
          # Linux: cargo-zigbuild provides the cross linker + libc; no glibc
          # pin is passed (napi's artifact naming cannot carry the `.X.Y`
          # suffix), so the ceiling check below guards the floor instead
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: binding.linux-x64-gnu.node
            cross: true
            smoke: native
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            artifact: binding.linux-x64-musl.node
            cross: true
            smoke: alpine
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: binding.linux-arm64-gnu.node
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            artifact: binding.linux-arm64-musl.node
            cross: true
          # Windows: the x64 runner's MSVC includes the ARM64 cross tools
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: binding.win32-x64-msvc.node
            smoke: native
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact: binding.win32-arm64-msvc.node
          # WebAssembly for the @petrea/wasm package;
          # smoke-tested in Node through the generated .wasip1.cjs loader
          - target: wasm32-wasip1
            os: ubuntu-24.04
            artifact: binding.wasm32-wasip1.wasm
            wasm: true
            smoke: wasm
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: false
      - run: pnpm install
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native
          key: ${{ matrix.target }}
      - if: matrix.cross
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - if: matrix.cross
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-zigbuild
      - if: matrix.target == 'x86_64-apple-darwin'
        # Node 20's oldest supported macOS; x86_64-apple-darwin defaults lower
        run: echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
      - if: endsWith(matrix.target, 'linux-gnu')
        name: Build (glibc pinned to Node 20's 2.28 floor)
        run: |
          # cargo resolves the target dir from the manifest (native/target),
          # not from the cwd this step runs in
          cargo zigbuild --release --target ${{ matrix.target }}.2.28 --manifest-path native/Cargo.toml
          mkdir -p dist
          cp native/target/${{ matrix.target }}/release/libpetrea_binding.so dist/${{ matrix.artifact }}
      - if: matrix.wasm
        name: Build
        run: node scripts/build-wasm.mjs
      - if: ${{ !matrix.wasm && !endsWith(matrix.target, 'linux-gnu') }}
        name: Build
        run: >-
          pnpm exec napi build --platform --release --manifest-path native/Cargo.toml
          ${{ matrix.cross && '--cross-compile' || '' }}
          --target ${{ matrix.target }}
          --output-dir dist
      - if: endsWith(matrix.target, 'linux-gnu')
        name: Check glibc symbol ceiling (Node 20 requires 2.28)
        run: |
          artifact="dist/${{ matrix.artifact }}"
          max="$(objdump -T "$artifact" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)"
          echo "highest GLIBC symbol requirement: ${max:-none}"
          if [ -n "$max" ] && [ "$max" != 'GLIBC_2.28' ] && [ "$(printf '%s\nGLIBC_2.28\n' "$max" | sort -V | head -1)" = 'GLIBC_2.28' ]; then
            echo "::error title=glibc ceiling::$artifact requires newer glibc symbols ($max) than Node 20's 2.28 floor"
            exit 1
          fi
      - if: matrix.smoke == 'native'
        name: Smoke test
        run: node scripts/smoke-native.mjs dist/${{ matrix.artifact }}
      - if: matrix.smoke == 'rosetta'
        name: Install Rosetta 2 (no-op when already present)
        run: softwareupdate --install-rosetta --agree-to-license || true
      - if: matrix.smoke == 'rosetta'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          architecture: x64
      - if: matrix.smoke == 'rosetta'
        name: Smoke test (x64 Node under Rosetta)
        run: node scripts/smoke-native.mjs dist/${{ matrix.artifact }}
      - if: matrix.smoke == 'alpine'
        name: Smoke test (musl static binary in Alpine)
        run: >-
          docker run --rm -v "$PWD":/work -w /work node:20-alpine
          node scripts/smoke-native.mjs dist/${{ matrix.artifact }}
      - if: matrix.smoke == 'wasm'
        name: Smoke test (wasm binding in Node)
        run: node scripts/smoke-native.mjs npm/wasm/binding.wasip1.cjs
      - if: ${{ !matrix.wasm }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binding-${{ matrix.target }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
      - if: matrix.wasm
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binding-${{ matrix.target }}
          path: npm/wasm/binding.*
          if-no-files-found: error

  # the win32-arm64 binary is cross-compiled on an x64 runner; load it on
  # real ARM64 Windows hardware
  smoke-windows-arm64:
    name: smoke win32 arm64
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binding-aarch64-pc-windows-msvc
          path: dist
      - name: Smoke test (native arm64)
        shell: bash
        run: node scripts/smoke-native.mjs dist/binding.win32-arm64-msvc.node

  # both arm64 Linux binaries are cross-built on x64; verify them on real
  # arm64 hardware — the gnu one directly, the musl one inside an arm64
  # Alpine container (native container on the arm64 runner, no qemu)
  smoke-arm64-linux:
    name: smoke aarch64 linux
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binding-aarch64-unknown-linux-*
          merge-multiple: true
          path: dist
      - name: Smoke test (gnu, native arm64)
        run: node scripts/smoke-native.mjs dist/binding.linux-arm64-gnu.node
      - name: Smoke test (musl, arm64 Alpine)
        run: >-
          docker run --rm -v "$PWD":/work -w /work node:20-alpine
          node scripts/smoke-native.mjs dist/binding.linux-arm64-musl.node
